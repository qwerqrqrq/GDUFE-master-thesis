# This workflow enables CI for compiling TeX file
# GitHub Action Docs: https://help.github.com/en/actions
permissions:
  contents: write
name: LaTeX Compile

on:
  push:
    branches: [dev, master]
    tags: ["v*"]
  pull_request:
    branches: [master]
jobs:
  compile_to_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Compile the LaTeX document with XeLaTeX
      - name: Compile gdufe_master_thesis_template
        uses: xu-cheng/latex-action@v3
        with:
          # root_file: compare.tex
          root_file: gdufe_master_thesis_template.tex
          args: -xelatex
          # args: -xelatex -file-line-error -interaction=nonstopmode -shell-escape
          extra_fonts: |
            ./fonts/*.ttf
            ./fonts/*.ttc
          # extra_system_packages: "fontconfig"
          pre_compile: "fc-cache -f"
          post_compile: "latexmk -c"

      - name: Compile gdufe_master_proposal_template
        uses: xu-cheng/latex-action@v3
        with:
          # root_file: compare.tex
          root_file: gdufe_master_proposal_template.tex
          args: -xelatex
          # args: -xelatex -file-line-error -interaction=nonstopmode -shell-escape
          extra_fonts: |
            ./fonts/*.ttf
            ./fonts/*.ttc
          # extra_system_packages: "fontconfig"
          pre_compile: "fc-cache -f"
          post_compile: "latexmk -c"

      # Upload compiled pdf to artifacts if compiled successfully
      - name: Upload pdf
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Upload thesis template and proposal template pdf
          path: |
            gdufe_master_thesis_template.pdf
            gdufe_master_proposal_template.pdf

      - name: Zip files
        if: ${{startsWith(github.ref, 'refs/tags/v')}}
        run: |
          zip -r GDUFE-master-thsis.zip figures fonts includefile gdufe_master_thesis_template.tex gdufe_master_thesis_template.pdf gdufe_master_proposal_template.tex gdufe_master_proposal_template.pdf gdufe_master.cls reference.bib -x includefile/\*.aux

      - name: show files
        run: |
          ls -R ${{ github.workspace}}
      - name: 上传到 Release
        if: ${{startsWith(github.ref, 'refs/tags/v')}}
        uses: softprops/action-gh-release@v2
        with:
          files: GDUFE-master-thsis.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - name: Check out repository code
        uses: actions/checkout@v4
      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
      - run: echo "🖥️ The workflow is now ready to test your code on the runner."
      - name: List files in the repository
        run: |
          ls -R ${{ github.workspace }}
      - run: echo "🍏 This job's status is ${{ job.status }}."