permissions:
  contents: read
name: LaTeX Compile

on:
  push:
    branches:
      - dev
      - master
    tags:
      - 'v*'
    paths:
      - 'gdufe_master*.{tex,cls}'
      - '**/*.tex'
      - '*.bib'
  workflow_dispatch:

concurrency:
  group: latex-compile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    name: Compile LaTeX documents
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Compile the LaTeX document with XeLaTeX
      - name: Compile latex documents
        uses: xu-cheng/latex-action@v3
        with:
          # root_file: compare.tex
          root_file: |
            gdufe_master_thesis_template.tex
            gdufe_master_proposal_template.tex
          args: -xelatex -interaction=nonstopmode -file-line-error
          extra_fonts: |
            ./fonts/*.ttf
            ./fonts/*.ttc
            ./fonts/*.otf
          # extra_system_packages: "fontconfig"
          # pre_compile: "fc-cache -f"
          post_compile: "latexmk -c"

      - name: Upload pdfs
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Upload thesis template and proposal template pdf
          path: |
            gdufe_master_thesis_template.pdf
            gdufe_master_proposal_template.pdf
          retention-days: 7

  package_and_release:
    name: Package & Release (on tag)
    needs: compile
    runs-on: ubuntu-latest
    if: ${{startsWith(github.ref, 'refs/tags/v')}}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare zip
        run: |
          zip -r GDUFE-master-thesis.zip \
            figures fonts includefile \
            gdufe_master_thesis_template.tex gdufe_master_thesis_template.pdf \
            gdufe_master_proposal_template.tex gdufe_master_proposal_template.pdf \
            gdufe_master.cls reference.bib CHANGELOG.md README.md -x includefile/*.aux

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: GDUFE-master-thesis.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - name: Check out repository code
        uses: actions/checkout@v4
      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
      - run: echo "🖥️ The workflow is now ready to test your code on the runner."
      - name: List files in the repository
        run: |
          ls -R ${{ github.workspace }}
      - run: echo "🍏 This job's status is ${{ job.status }}."